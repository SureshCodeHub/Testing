name: RAG CI/CD Pipeline

on:
  push:
    branches:
      - main
# ✅ ADD HERE (global level)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # =========================
    # 🔷 CI (Continuous Integration)
    # =========================

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: pip install -r requirements.txt

    # ✅ THIS IS YOUR STEP (correct placement)
    - name: Run Tests
      run: pytest
      env:
        PYTHONPATH: .

    # =========================
    # 🔷 ADD AZURE LOGIN HERE ✅
    # =========================

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # =========================
    # 🔷 CD (Continuous Deployment)
    # =========================

    - name: Build Docker Image
      run: docker build -t rag-app .

    - name: Login to Azure Container Registry
      run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Tag Image
      run: docker tag rag-app ${{ secrets.ACR_LOGIN }}/rag-app:latest

    - name: Push Image
      run: docker push ${{ secrets.ACR_LOGIN }}/rag-app:latest

    - name: Deploy to Azure Container App
      run: |
        az containerapp update \
          --name ragcicd \
          --resource-group credit-risk-rg \
          --image ragregistry123.azurecr.io/rag-app:latest \
          --registry-server ragregistry123.azurecr.io \
          --registry-username ragregistry123 \
          --registry-password 3I1EsWLDGNGqhqLokwgZW2P5fyiDfxotdbf2zF7D29DUJCG2fb9MJQQJ99CCACYeBjFEqg7NAAACAZCRKRIt \
          --set-env-vars OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}