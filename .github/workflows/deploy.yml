name: RAG CI/CD Pipeline

on:
  push:
    branches:
      - main

# ✅ Force Node 24 (removes warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 🔷 CI (Continuous Integration)
    # =========================

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Tests
      run: pytest
      env:
        PYTHONPATH: .

    # =========================
    # 🔷 Azure Login
    # =========================

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # =========================
    # 🔷 CD (Continuous Deployment)
    # =========================

    - name: Build Docker Image
      run: docker build -t rag-app .

    - name: Login to Azure Container Registry
      run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Tag Image
      run: docker tag rag-app ${{ secrets.ACR_LOGIN }}/rag-app:latest

    - name: Push Image
      run: docker push ${{ secrets.ACR_LOGIN }}/rag-app:latest

    # ✅ Configure ACR access (required once, safe to run always)
    - name: Configure Container App Registry
      run: |
        az containerapp registry set \
          --name ragcicd \
          --resource-group credit-risk-rg \
          --server ${{ secrets.ACR_LOGIN }} \
          --username ${{ secrets.ACR_USERNAME }} \
          --password ${{ secrets.ACR_PASSWORD }}

    # ✅ Deploy updated image
    - name: Deploy to Azure Container App
      run: |
        az containerapp update \
          --name ragcicd \
          --resource-group credit-risk-rg \
          --image ${{ secrets.ACR_LOGIN }}/rag-app:latest \
          --set-env-vars OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}